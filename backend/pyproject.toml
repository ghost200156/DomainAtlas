[project]
name = "backend"
version = "0.1.0"
description = "DomainAtlas field-learning assistant backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "pydantic-ai>=2.9.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "socksio>=1.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
